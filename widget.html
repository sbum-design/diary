<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Diary Book 위젯 연결</title>
<style>
:root{color-scheme:light only;--bg:#f2f4f7;--page:#fff;--ink:#1f2329;--ink2:#5c6370;--ac:#4772fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{background:var(--page);border-radius:16px;padding:28px 24px;max-width:420px;width:100%;display:grid;gap:14px;text-align:center;box-shadow:0 10px 30px rgba(30,40,60,.08)}
h1{margin:0;font-size:1.3rem}
p{margin:0;color:var(--ink2);line-height:1.6;font-size:.95rem}
.btn{display:block;background:var(--ac);color:#fff;text-decoration:none;border-radius:10px;padding:13px;font-weight:600}
.note{font-size:.82rem}
</style>
</head>
<body>
<main>
  <h1>위젯 연결</h1>
  <p id="msg">Scriptable로 돌아가는 중입니다…</p>
  <a id="go" class="btn" href="#">Scriptable 열기</a>
  <p class="note" id="note">자동으로 넘어가지 않으면 위 버튼을 누르세요.</p>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search),code=q.get('code'),err=q.get('error');
  var go=document.getElementById('go'),msg=document.getElementById('msg'),note=document.getElementById('note');
  if(code){
    var u='scriptable:///run/DiaryWidget?code='+encodeURIComponent(code);
    go.href=u;
    setTimeout(function(){location.href=u},300);
  }else{
    msg.textContent=err?('연결이 취소되었습니다 ('+err+'). Scriptable에서 다시 실행해 주세요.'):'이 페이지는 아이패드 위젯 연결용입니다.';
    go.style.display='none';note.style.display='none';
  }
})();
</script>
</body>
</html>
